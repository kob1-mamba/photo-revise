<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片压缩工具 📸</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@6.4.0/css/all.min.css">

  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fbff;
      --surface-deep: #eef4ff;
      --text-main: #14213d;
      --text-sub: #60708a;
      --text-muted: #8a98ad;
      --line: #d9e2f1;
      --line-strong: #b8c7df;
      --brand: #215cff;
      --brand-deep: #1745c7;
      --brand-soft: #eaf0ff;
      --brand-softer: #f3f6ff;
      --success: #16a34a;
      --danger: #dc2626;
      --shadow-soft: 0 18px 50px rgba(28, 56, 107, 0.08);
      --shadow-card: 0 10px 30px rgba(28, 56, 107, 0.08);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background:
        radial-gradient(circle at 8% 8%, rgba(33, 92, 255, 0.12), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(111, 143, 255, 0.10), transparent 26%),
        linear-gradient(135deg, #f7faff 0%, #eef4fb 42%, #f9fbff 100%);
    }

    body {
      min-height: 100vh;
      max-width: 1180px;
      margin: 0 auto;
      padding: clamp(28px, 5vw, 56px) 20px 48px;
      color: var(--text-main);
      font-family:
        ui-sans-serif,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(33, 92, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(33, 92, 255, 0.045) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.75), transparent 72%);
      z-index: -1;
    }

    .page-title {
      width: fit-content;
      margin: 0 auto clamp(26px, 4vw, 38px);
      color: var(--text-main);
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 750;
      letter-spacing: -0.04em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
    }

    .page-title::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -12px;
      width: 72%;
      height: 10px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(33, 92, 255, 0.28), transparent);
      filter: blur(4px);
    }

    .page-title i {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      color: var(--brand);
      background:
        linear-gradient(145deg, #ffffff, #eaf0ff);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.8),
        0 12px 24px rgba(33, 92, 255, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .upload-box {
      background:
        linear-gradient(180deg, rgba(255,255,255,.94), rgba(248,251,255,.94));
      border: 1px solid rgba(184, 199, 223, 0.78);
      border-radius: var(--radius-xl);
      padding: clamp(44px, 6vw, 72px) 24px;
      text-align: center;
      cursor: pointer;
      transition:
        transform .35s var(--ease),
        border-color .35s var(--ease),
        box-shadow .35s var(--ease),
        background .35s var(--ease);
      margin-bottom: 22px;
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .upload-box::before {
      content: "";
      position: absolute;
      inset: 14px;
      border: 1.5px dashed rgba(33, 92, 255, 0.26);
      border-radius: calc(var(--radius-xl) - 10px);
      pointer-events: none;
      transition: border-color .35s var(--ease), inset .35s var(--ease);
    }

    .upload-box::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      right: -96px;
      top: -112px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(33, 92, 255, 0.16), transparent 68%);
      z-index: -1;
      transition: transform .45s var(--ease);
    }

    .upload-box:hover {
      transform: translateY(-3px);
      border-color: rgba(33, 92, 255, 0.62);
      background:
        linear-gradient(180deg, rgba(255,255,255,.98), rgba(242,246,255,.98));
      box-shadow: 0 26px 70px rgba(28, 56, 107, 0.13);
    }

    .upload-box:hover::before {
      inset: 11px;
      border-color: rgba(33, 92, 255, 0.48);
    }

    .upload-box:hover::after {
      transform: scale(1.08) translate(-8px, 8px);
    }

    .upload-icon {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      border-radius: 24px;
      color: var(--brand);
      background:
        linear-gradient(145deg, #ffffff, #e7efff);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.92),
        0 20px 36px rgba(33, 92, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .upload-box p {
      font-size: 16px;
      color: var(--text-sub);
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .control-panel {
      background:
        linear-gradient(180deg, rgba(255,255,255,.96), rgba(248,251,255,.96));
      border: 1px solid rgba(217, 226, 241, 0.9);
      border-radius: var(--radius-lg);
      padding: clamp(18px, 3vw, 26px);
      margin-bottom: 18px;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .control-panel::before {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(33, 92, 255, 0.22), transparent);
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .item {
      min-height: 46px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 650;
      padding: 8px 10px 8px 12px;
      border-radius: 14px;
      background: rgba(244, 248, 255, 0.7);
      border: 1px solid rgba(217, 226, 241, 0.72);
    }

    .item i {
      width: 28px;
      height: 28px;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex: 0 0 auto;
    }

    input[type="number"],
    input[type="text"],
    select {
      height: 36px;
      padding: 7px 11px;
      border: 1px solid rgba(184, 199, 223, 0.9);
      border-radius: 11px;
      outline: none;
      font-size: 14px;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.95);
      transition:
        border-color .25s var(--ease),
        box-shadow .25s var(--ease),
        background .25s var(--ease);
    }

    input[type="number"] {
      width: 104px;
    }

    input[type="text"] {
      width: 154px;
    }

    select {
      min-width: 104px;
      cursor: pointer;
    }

    input:focus,
    select:focus {
      border-color: rgba(33, 92, 255, 0.78);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(33, 92, 255, 0.10);
    }

    .btn-area {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    button {
      min-width: 128px;
      min-height: 46px;
      padding: 12px 28px;
      border-radius: 14px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition:
        transform .22s var(--ease),
        box-shadow .22s var(--ease),
        background .22s var(--ease),
        opacity .22s var(--ease);
      user-select: none;
    }

    button:not(:disabled):active {
      transform: translateY(1px) scale(0.99);
    }

    #compressBtn {
      color: #ffffff;
      background:
        linear-gradient(135deg, #326cff 0%, #174be8 100%);
      box-shadow:
        0 16px 28px rgba(33, 92, 255, 0.26),
        inset 0 1px 0 rgba(255,255,255,.28);
    }

    #compressBtn:hover {
      background:
        linear-gradient(135deg, #2f64ef 0%, #123ec5 100%);
      box-shadow:
        0 20px 36px rgba(33, 92, 255, 0.32),
        inset 0 1px 0 rgba(255,255,255,.28);
      transform: translateY(-2px);
    }

    #resetBtn {
      color: var(--text-sub);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(184, 199, 223, 0.8);
      box-shadow: 0 10px 20px rgba(28, 56, 107, 0.06);
    }

    #resetBtn:hover {
      color: var(--text-main);
      background: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 16px 28px rgba(28, 56, 107, 0.10);
    }

    .preview-download-btn {
      margin-top: 14px;
      min-width: 112px;
      min-height: 40px;
      padding: 9px 20px;
      font-size: 14px;
      color: #ffffff;
      background:
        linear-gradient(135deg, #2f6dff, #1d4ed8);
      border-radius: 12px;
      box-shadow: 0 12px 22px rgba(29, 78, 216, 0.22);
    }

    .preview-download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 26px rgba(29, 78, 216, 0.28);
    }

    .preview-download-btn:disabled,
    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .preview-wrap {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 3vw, 24px);
      margin-top: 26px;
    }

    .preview-card {
      min-width: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,251,255,.98));
      border: 1px solid rgba(217, 226, 241, 0.9);
      border-radius: var(--radius-lg);
      padding: clamp(18px, 2.5vw, 24px);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
    }

    .preview-card::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -90px;
      width: 210px;
      height: 210px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(33, 92, 255, 0.08), transparent 68%);
      pointer-events: none;
    }

    .preview-card h3 {
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 15px;
      font-weight: 760;
      display: flex;
      align-items: center;
      gap: 9px;
      letter-spacing: -0.02em;
      position: relative;
      z-index: 1;
    }

    .preview-card h3 i {
      width: 30px;
      height: 30px;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .img-box {
      min-height: 250px;
      border: 1px solid rgba(217, 226, 241, 0.95);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(135deg, rgba(248,251,255,.96), rgba(243,247,255,.92));
      position: relative;
      padding: 14px;
      overflow: hidden;
      z-index: 1;
    }

    .img-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(45deg, rgba(33, 92, 255, 0.035) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(33, 92, 255, 0.035) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(33, 92, 255, 0.035) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(33, 92, 255, 0.035) 75%);
      background-size: 22px 22px;
      background-position: 0 0, 0 11px, 11px -11px, -11px 0;
      opacity: .65;
      pointer-events: none;
    }

    .img-box p {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .img-box img {
      max-width: 100%;
      max-height: 380px;
      border-radius: 14px;
      box-shadow:
        0 18px 34px rgba(28, 56, 107, 0.16),
        0 0 0 1px rgba(255,255,255,.8);
      position: relative;
      z-index: 1;
    }

    .progress-container {
      width: min(86%, 420px);
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(217, 226, 241, 0.9);
      box-shadow: 0 12px 28px rgba(28, 56, 107, 0.08);
      position: relative;
      z-index: 1;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: #e2e8f4;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background:
        linear-gradient(90deg, #6f8fff, #215cff);
      width: 0%;
      border-radius: 999px;
      transition: width 0.3s var(--ease);
    }

    .walking-person {
      width: 32px;
      height: 32px;
      color: var(--brand);
      background: var(--brand-soft);
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      animation: walk 1s steps(4) infinite;
      flex: 0 0 auto;
    }

    .progress-container span {
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    @keyframes walk {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(8px);
      }
    }

    .size-info {
      margin-top: 14px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text-sub);
      font-weight: 600;
      position: relative;
      z-index: 1;
    }

    .size-info span {
      color: var(--text-main);
      font-weight: 760;
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(234, 240, 255, 0.82);
    }

    #fileInput {
      display: none;
    }

    @media (max-width: 880px) {
      body {
        padding-inline: 16px;
      }

      .preview-wrap {
        grid-template-columns: 1fr;
      }

      .control-row {
        align-items: stretch;
      }

      .item {
        width: 100%;
        justify-content: flex-start;
      }

      input[type="number"],
      input[type="text"],
      select {
        flex: 1;
        width: auto;
      }
    }

    @media (max-width: 560px) {
      .page-title {
        font-size: 28px;
      }

      .page-title i {
        width: 42px;
        height: 42px;
      }

      .upload-box {
        padding: 46px 18px;
      }

      .upload-icon {
        width: 66px;
        height: 66px;
        font-size: 30px;
      }

      .btn-area {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .img-box {
        min-height: 220px;
      }

      .progress-container {
        width: 100%;
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <h1 class="page-title">
    <i class="fa-solid fa-image"></i>图片压缩工具 📸
  </h1>

  <div class="upload-box" id="uploadArea">
    <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
    <p>✨ 点击或拖拽图片至此处上传 ✨</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="control-panel">
    <div class="control-row">
      <div class="item">
        <i class="fa-solid fa-maximize"></i>
        <span>宽度（不放大） 📏：</span>
        <input type="number" id="maxWidth" value="1024">px
      </div>

      <div class="item">
        <i class="fa-solid fa-hard-drive"></i>
        <span>目标大小 📦：</span>
        <input type="number" id="targetSize" min="1" step="1" value="100">KB
      </div>

      <div class="item">
        <i class="fa-solid fa-file"></i>
        <span>格式 📄：</span>
        <select id="format">
          <option value="jpeg" selected>JPG</option>
          <option value="png">PNG</option>
          <option value="pdf">PDF</option>
        </select>
      </div>

      <div class="item">
        <i class="fa-solid fa-pen"></i>
        <span>文件名 ✏️：</span>
        <input type="text" id="fileName" value="compressed" placeholder="输入文件名">
      </div>
    </div>
  </div>

  <div class="btn-area">
    <button id="compressBtn" disabled>
      压缩 🗜️
    </button>
    <button id="resetBtn">
      重置 🔄
    </button>
  </div>

  <div class="preview-wrap">
    <div class="preview-card">
      <h3><i class="fa-solid fa-image"></i>原图预览 🖼️</h3>
      <div class="img-box" id="originBox">
        <p style="color:#999">原图预览区</p>
      </div>
      <div class="size-info">
        原图大小：<span id="originSize">--</span> |
        原图尺寸：<span id="originDimension">--</span>
      </div>
    </div>

    <div class="preview-card">
      <h3><i class="fa-solid fa-compress"></i>压缩预览 🗜️</h3>
      <div class="img-box" id="compressBox">
        <p style="color:#999">点击压缩后显示预览</p>
      </div>
      <div class="size-info">
        压缩后大小：<span id="compressSize">--</span> |
        压缩后尺寸：<span id="compressDimension">--</span> |
        目标：<span id="targetSizeShow">100 KB</span> |
        压缩率：<span id="rate">--</span>
      </div>
      <button class="preview-download-btn" id="previewDownloadBtn" disabled>
        下载 📥
      </button>
    </div>
  </div>

<script>
const { jsPDF } = window.jspdf;

const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');
const maxWidthInput = document.getElementById('maxWidth');
const targetSizeInput = document.getElementById('targetSize');
const formatSelect = document.getElementById('format');
const fileNameInput = document.getElementById('fileName');
const compressBtn = document.getElementById('compressBtn');
const resetBtn = document.getElementById('resetBtn');
const previewDownloadBtn = document.getElementById('previewDownloadBtn');

const originBox = document.getElementById('originBox');
const compressBox = document.getElementById('compressBox');
const originSizeText = document.getElementById('originSize');
const originDimensionText = document.getElementById('originDimension');
const compressSizeText = document.getElementById('compressSize');
const compressDimensionText = document.getElementById('compressDimension');
const targetSizeShowText = document.getElementById('targetSizeShow');
const rateText = document.getElementById('rate');

const DEFAULT_VALUES = {
  maxWidth: 1024,
  targetSize: 100,
  format: 'jpeg',
  fileName: 'compressed'
};

let originFile = null;
let originImage = null;
let compressBlob = null;
let compressPreviewUrl = '';
let downloadUrl = '';
let progressInterval = null;

targetSizeInput.addEventListener('input', () => {
  targetSizeShowText.textContent = `${targetSizeInput.value || DEFAULT_VALUES.targetSize} KB`;
});

uploadArea.addEventListener('click', () => fileInput.click());

uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.style.background = '#f8faff';
});

uploadArea.addEventListener('dragleave', () => {
  uploadArea.style.background = '';
});

uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.background = '';

  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) {
    handleFile(file);
  }
});

fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) {
    handleFile(fileInput.files[0]);
  }
});

function handleFile(file) {
  originFile = file;
  originImage = null;
  compressBlob = null;
  clearObjectUrls();

  compressBtn.disabled = false;
  previewDownloadBtn.disabled = true;

  originSizeText.textContent = formatSize(file.size);
  targetSizeShowText.textContent = `${targetSizeInput.value || DEFAULT_VALUES.targetSize} KB`;

  compressBox.innerHTML = '<p style="color:#999">点击压缩后显示预览</p>';
  compressSizeText.textContent = '--';
  compressDimensionText.textContent = '--';
  rateText.textContent = '--';

  const reader = new FileReader();

  reader.onload = e => {
    const img = new Image();

    img.onload = () => {
      originImage = img;
      originDimensionText.textContent = `${img.width}×${img.height}`;
      originBox.innerHTML = `<img src="${e.target.result}" alt="原图">`;
    };

    img.onerror = () => {
      alert('图片读取失败，请重新上传');
      resetAll();
    };

    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
}

function createProgressBar() {
  if (progressInterval) {
    clearInterval(progressInterval);
  }

  const progressHtml = `
    <div class="progress-container">
      <i class="fas fa-person-walking walking-person"></i>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <span>压缩中...</span>
    </div>
  `;

  compressBox.innerHTML = progressHtml;

  let progress = 0;
  const progressFill = compressBox.querySelector('.progress-fill');

  progressInterval = setInterval(() => {
    progress += Math.random() * 6;
    if (progress > 95) {
      progress = 95;
    }
    progressFill.style.width = `${progress}%`;
  }, 180);

  return () => {
    clearInterval(progressInterval);
    progressFill.style.width = '100%';
  };
}

compressBtn.addEventListener('click', async () => {
  if (!originFile || !originImage) {
    return;
  }

  let targetBytes;

  try {
    targetBytes = getTargetBytes();
  } catch (err) {
    alert(err.message);
    return;
  }

  if (originFile.size < targetBytes) {
    alert('原图小于目标大小，无需压缩');
    return;
  }

  compressBtn.disabled = true;
  previewDownloadBtn.disabled = true;
  compressBtn.innerHTML = '压缩中... ⏳';

  const completeProgress = createProgressBar();

  try {
    const result = await compressStrictlyToTarget(originImage, targetBytes);

    completeProgress();

    setTimeout(() => {
      applyCompressResult(result);
      compressBtn.innerHTML = '压缩 🗜️';
      compressBtn.disabled = false;
      previewDownloadBtn.disabled = false;
    }, 250);

  } catch (err) {
    completeProgress();

    setTimeout(() => {
      compressBox.innerHTML = `<p style="color:#ef4444">压缩失败：${err.message}</p>`;
      compressBtn.innerHTML = '压缩 🗜️';
      compressBtn.disabled = false;
      previewDownloadBtn.disabled = true;
    }, 250);
  }
});

async function compressStrictlyToTarget(img, targetBytes) {
  const fmt = formatSelect.value;
  const maxWidth = Number(maxWidthInput.value) || DEFAULT_VALUES.maxWidth;

  const originWidth = img.width;
  const originHeight = img.height;

  let width = Math.min(originWidth, maxWidth);
  let height = Math.round(originHeight * width / originWidth);

  const minWidth = 80;
  const minHeight = 80;

  let bestResult = null;

  while (width >= minWidth && height >= minHeight) {
    let result;

    if (fmt === 'png') {
      result = await createPngCandidate(img, width, height);

      if (result.blob.size <= targetBytes) {
        bestResult = result;
        break;
      }
    } else if (fmt === 'pdf') {
      result = await findBestJpegPdfCandidate(img, width, height, targetBytes);

      if (result) {
        bestResult = result;
        break;
      }
    } else {
      result = await findBestJpegCandidate(img, width, height, targetBytes);

      if (result) {
        bestResult = result;
        break;
      }
    }

    width = Math.floor(width * 0.85);
    height = Math.floor(height * 0.85);
  }

  if (!bestResult || bestResult.blob.size > targetBytes) {
    throw new Error('在当前目标大小内无法完成压缩，请调大目标大小或改用 JPG 格式');
  }

  return bestResult;
}

async function findBestJpegCandidate(img, width, height, targetBytes) {
  let low = 0.05;
  let high = 0.95;
  let best = null;

  for (let i = 0; i < 10; i++) {
    const quality = (low + high) / 2;
    const result = await createJpegCandidate(img, width, height, quality);

    if (result.blob.size <= targetBytes) {
      best = result;
      low = quality;
    } else {
      high = quality;
    }
  }

  return best;
}

async function findBestJpegPdfCandidate(img, width, height, targetBytes) {
  let low = 0.05;
  let high = 0.95;
  let best = null;

  for (let i = 0; i < 10; i++) {
    const quality = (low + high) / 2;
    const result = await createPdfCandidate(img, width, height, quality);

    if (result.blob.size <= targetBytes) {
      best = result;
      low = quality;
    } else {
      high = quality;
    }
  }

  return best;
}

async function createJpegCandidate(img, width, height, quality) {
  const canvas = drawImageToCanvas(img, width, height);

  const blob = await canvasToBlob(canvas, 'image/jpeg', quality);

  return {
    blob,
    previewUrl: URL.createObjectURL(blob),
    downloadBlob: blob,
    width,
    height,
    type: 'jpeg'
  };
}

async function createPngCandidate(img, width, height) {
  const canvas = drawImageToCanvas(img, width, height);

  const blob = await canvasToBlob(canvas, 'image/png');

  return {
    blob,
    previewUrl: URL.createObjectURL(blob),
    downloadBlob: blob,
    width,
    height,
    type: 'png'
  };
}

async function createPdfCandidate(img, width, height, quality) {
  const canvas = drawImageToCanvas(img, width, height);
  const imageData = canvas.toDataURL('image/jpeg', quality);

  const pdf = new jsPDF({
    orientation: width >= height ? 'landscape' : 'portrait',
    unit: 'px',
    format: [width, height],
    compress: true
  });

  pdf.addImage(imageData, 'JPEG', 0, 0, width, height, undefined, 'FAST');

  const pdfBlob = pdf.output('blob');

  return {
    blob: pdfBlob,
    previewUrl: imageData,
    downloadBlob: pdfBlob,
    width,
    height,
    type: 'pdf'
  };
}

function drawImageToCanvas(img, width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, width, height);

  return canvas;
}

function canvasToBlob(canvas, mimeType, quality) {
  return new Promise((resolve, reject) => {
    canvas.toBlob(blob => {
      if (!blob) {
        reject(new Error('浏览器生成压缩文件失败'));
        return;
      }
      resolve(blob);
    }, mimeType, quality);
  });
}

function applyCompressResult(result) {
  compressBlob = result.downloadBlob;

  clearObjectUrls();

  if (result.type === 'pdf') {
    compressPreviewUrl = result.previewUrl;
    downloadUrl = URL.createObjectURL(result.downloadBlob);
  } else {
    compressPreviewUrl = result.previewUrl;
    downloadUrl = result.previewUrl;
  }

  compressBox.innerHTML = `<img src="${compressPreviewUrl}" alt="压缩预览">`;

  compressSizeText.textContent = formatSize(result.downloadBlob.size);
  compressDimensionText.textContent = `${result.width}×${result.height}`;

  const saveRate = (1 - result.downloadBlob.size / originFile.size) * 100;
  rateText.textContent = `${saveRate.toFixed(1)}%`;
}

previewDownloadBtn.addEventListener('click', () => {
  if (!compressBlob || !downloadUrl) {
    return;
  }

  const name = fileNameInput.value.trim() || DEFAULT_VALUES.fileName;
  const fmt = formatSelect.value;
  const ext = fmt === 'jpeg' ? 'jpg' : fmt;

  const a = document.createElement('a');
  a.href = downloadUrl;
  a.download = `${name}.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

resetBtn.addEventListener('click', resetAll);

function resetAll() {
  if (progressInterval) {
    clearInterval(progressInterval);
  }

  originFile = null;
  originImage = null;
  compressBlob = null;
  clearObjectUrls();

  fileInput.value = '';

  maxWidthInput.value = DEFAULT_VALUES.maxWidth;
  targetSizeInput.value = DEFAULT_VALUES.targetSize;
  formatSelect.value = DEFAULT_VALUES.format;
  fileNameInput.value = DEFAULT_VALUES.fileName;

  originBox.innerHTML = '<p style="color:#999">原图预览区</p>';
  compressBox.innerHTML = '<p style="color:#999">压缩预览区</p>';

  originSizeText.textContent = '--';
  originDimensionText.textContent = '--';
  compressSizeText.textContent = '--';
  compressDimensionText.textContent = '--';
  targetSizeShowText.textContent = '100 KB';
  rateText.textContent = '--';

  compressBtn.innerHTML = '压缩 🗜️';
  compressBtn.disabled = true;
  previewDownloadBtn.disabled = true;
}

function getTargetBytes() {
  const targetKB = parseFloat(targetSizeInput.value) || DEFAULT_VALUES.targetSize;

  if (targetKB <= 0) {
    throw new Error('目标大小必须大于 0');
  }

  return targetKB * 1024;
}

function clearObjectUrls() {
  if (compressPreviewUrl && compressPreviewUrl.startsWith('blob:')) {
    URL.revokeObjectURL(compressPreviewUrl);
  }

  if (downloadUrl && downloadUrl.startsWith('blob:') && downloadUrl !== compressPreviewUrl) {
    URL.revokeObjectURL(downloadUrl);
  }

  compressPreviewUrl = '';
  downloadUrl = '';
}

function formatSize(bytes) {
  if (bytes < 1024) {
    return `${bytes} B`;
  }

  if (bytes < 1024 * 1024) {
    return `${(bytes / 1024).toFixed(2)} KB`;
  }

  return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
}
</script>
